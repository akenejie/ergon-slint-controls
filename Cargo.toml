[package]
name = "ergon-slint-controls"
version = "0.15.1"
edition = "2021"
links = "ergon-slint-controls"

[lib]
path = "src/lib.rs"

[features]
default = []
# モーダル ダイアログ制御ロジック全体 (子ウィンドウ方式 + ウィンドウ内
# オーバーレイ方式の両実装) をコンパイルに含めるかどうかの取捨選択。
# どちらの方式で出すかはこの feature では決めない (アプリのソースコード内の
# 定数 modal_dialog::ModalMode で決める。README 参照)。
# 有効にすると patched winit fork が必要になる。メニューやネイティブ
# ダイアログだけを使うアプリは有効化しなくてよい。
modal-dialog = ["dep:i-slint-backend-winit"]

[[example]]
name = "timekeeper"
required-features = ["modal-dialog"]

[dependencies]
# アプリと同じ slint インスタンスが使われる (Cargo の feature 統合)。
# 生成コードが参照する型・backend を揃えるため、アプリ側と同じ features を指定する。
slint = { version = "1.17", features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
# modal-dialog feature: 子ダイアログ生成時の OS 属性フック
# (window_attributes_hook) を仕込むための winit バックエンド。
i-slint-backend-winit = { version = "1.17.1", features = ["renderer-femtovg"], optional = true }
# ui_font モジュール: OS 標準 UI フォントを各ウィンドウの WindowItem (slint
# core の公開型) へ流し込むための core 直参照 (全 OS)。slint 本体と同じバー
# ジョンに統一される (=1.17.1)。
i-slint-core = "1.17.1"

[target.'cfg(windows)'.dependencies]
# dialogs::prompt_folder の IFileOpenDialog は windows クレートの
# windows::Win32::UI::Shell 経由で呼ぶ。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# cursor::* は Gdi (DIBSection/CreateBitmap) と WindowsAndMessaging
# (CreateIconIndirect/LoadCursor/SetWindowLongPtr) を使う。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# cursor::set_custom_cursor は X11 の Render 拡張で ARGB32 のカスタムカーソルを
# 積む。gtk モジュール / dialogs は x11rb を使い、ダイアログを X 窓レベルで
# WM_TRANSIENT_FOR 設定して親ウィンドウ基準のモーダル配置にする。winit 0.30 は
# xlib_window を公開しないため、同プロセスのトップレベルウィンドウを x11rb 接続
# から探して change_window_attributes で張り替える。
x11rb = { version = "0.13", features = ["render", "image"] }
# gtk モジュール: 同一プロセスから GTK 標準ダイアログ (MessageDialog /
# FileChooserDialog) をモーダルにブロック実行する。ui_font モジュールは
# gtk-font-name (デスクトップ環境の UI フォント設定) を読み、フォント名の
# パースに再 export される pango を使う。ビルドには libgtk-3-dev
# (pkg-config は `gtk+-3.0`) が必要。
gtk = "0.18"
# GTK の GdkWindow から X ウィンドウ ID (XID) を直接取得する。ダイアログの
# transient 設定を root ツリーの差分検出に頼ると WM の reparent と競合して
# 付け損ねるため、ここから確実に XID を取る。
gdkx11 = "0.18"

[build-dependencies]
# as_library() を使うには experimental-module-builds が必要。
slint-build = { version = "1.17", features = ["experimental-module-builds"] }

# modal-dialog feature は生成時ダイアログ枠のため winit パッチ フォークを
# 必須とする。Cargo の仕様上 [patch] はビルドのルートにしか書けないため、
# 本ワークスペース自身のビルド/テスト用にここにも置く (feature を有効にする
# 利用アプリも同じ 1 行を置く必要がある)。
[patch.crates-io]
winit = { git = "https://github.com/akenejie/slint-modal-winit", tag = "v0.30.13-modal.15" }
